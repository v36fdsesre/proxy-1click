<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обновление расширения</title>
  <style>
    :root { --bg:#fff; --card:#f3f5f7; --ink:#1f2a33; --muted:#7a8794; --green:#3f9d5b; --bad:#d4483d; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1e242b; --ink:#eef2f5; --muted:#8d9aa7; --green:#5cc27a; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
      font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif; }
    main { width:min(460px,92vw); padding:28px; background:var(--card); border-radius:18px; }
    h1 { margin:0 0 6px; font-size:22px; }
    p { margin:8px 0; color:var(--muted); }
    #msg { color:var(--ink); min-height:24px; }
    #msg.err { color:var(--bad); }
    button { font:inherit; cursor:pointer; border:0; border-radius:12px; padding:12px 18px; font-weight:600; margin:6px 8px 0 0; }
    #go { background:var(--green); color:#fff; }
    #pick { background:transparent; color:var(--muted); border:1px solid var(--muted); }
    button[hidden] { display:none; }
    a { color:var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Обновление расширения</h1>
    <p id="ver"></p>
    <p id="msg" role="status">Проверяю…</p>
    <button id="go" hidden>Обновить сейчас</button>
    <button id="pick" hidden>Выбрать другую папку</button>
    <p id="hint"></p>
    <p><a id="manual" href="#" target="_blank" rel="noopener" hidden>Скачать архив вручную</a></p>
  </main>
  <script src="config.js"></script>
  <script src="update.js"></script>
  <script src="installer.js"></script>
  <script src="updater.js"></script>
</body>
</html>
